server {
  listen 80;
  server_name _;
  client_max_body_size 10m;
  location /api/ { proxy_pass http://api:4000/api/; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /socket.io/ { proxy_pass http://api:4000/socket.io/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  location /uploads/ { proxy_pass http://api:4000/uploads/; }
  location / { try_files $uri $uri/ /index.html; }
}
